<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI 2040 · Plan A — The Film</title>
<script src="./vendor/react.js"></script>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Limelight&amp;family=Josefin+Sans:wght@300;400;600;700&amp;family=Poiret+One&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070706}
a{color:#D9B65E}a:hover{color:#F1E7CF}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.55)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipedown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes iris{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shutL{from{transform:translateX(0)}to{transform:translateX(-101%)}}
@keyframes shutR{from{transform:translateX(0)}to{transform:translateX(101%)}}
@keyframes glint{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes tickerin{from{opacity:0;letter-spacing:.6em}to{opacity:1}}
@keyframes needle{from{transform:rotate(-90deg)}to{transform:rotate(var(--to,0deg))}}
.a-needle{animation:needle 2.6s cubic-bezier(.3,1.35,.4,1) both}
.a-rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.a-fade{animation:fade 1.2s ease both}
.a-growx{transform-origin:left center;animation:growx 1.2s cubic-bezier(.3,.8,.2,1) both}
.a-growy{transform-origin:center bottom;animation:growy 1.1s cubic-bezier(.3,.8,.2,1) both}
.a-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease-in-out both}
.a-pop{animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
.a-wipe{animation:wipe 1.4s cubic-bezier(.6,0,.2,1) both}
.a-wipedown{animation:wipedown 1.4s cubic-bezier(.6,0,.2,1) both}
.a-iris{animation:iris 1.6s cubic-bezier(.6,0,.2,1) both}
.a-kb{animation:kb 14s ease-out both}
.a-spin{transform-origin:center;animation:spin 90s linear infinite}
.a-glint{animation:glint 3s ease-in-out infinite}
.a-ticker{animation:tickerin 1.4s ease both}
.d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}.d4{animation-delay:1.2s}.d5{animation-delay:1.5s}
.d6{animation-delay:1.8s}.d7{animation-delay:2.1s}.d8{animation-delay:2.4s}.d9{animation-delay:2.7s}.d10{animation-delay:3s}
.d11{animation-delay:3.3s}.d12{animation-delay:3.6s}.d13{animation-delay:3.9s}.d14{animation-delay:4.2s}.d15{animation-delay:4.5s}
.d16{animation-delay:4.8s}.d17{animation-delay:5.1s}.d18{animation-delay:5.4s}.d19{animation-delay:5.7s}.d20{animation-delay:6s}
.d22{animation-delay:6.6s}.d24{animation-delay:7.2s}.d26{animation-delay:7.8s}.d28{animation-delay:8.4s}.d30{animation-delay:9s}
.shut-l{animation:shutL .9s cubic-bezier(.7,0,.3,1) .05s both}
.shut-r{animation:shutR .9s cubic-bezier(.7,0,.3,1) .05s both}
.ctl{width:44px;height:44px;border-radius:22px;border:1.5px solid #C9A54E;background:#14120E;color:#D9B65E;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ctl:hover{background:#2A2416}
.chip{height:30px;min-width:40px;padding:0 6px;border:1px solid #5E5134;background:transparent;color:#B3A88E;font-family:'Josefin Sans',sans-serif;font-size:13px;letter-spacing:.06em;cursor:pointer}
.chip:hover{border-color:#C9A54E;color:#F1E7CF}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s !important;animation-delay:0s !important;animation-iteration-count:1 !important}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #070706; font-family: 'Josefin Sans', sans-serif; color: #F1E7CF; display: flex; flex-direction: column">
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0F0E0C">
<sc-if value="{{on.s0}}" hint-placeholder-val="{{true}}"><dc-import name="Title" hint-size="1280px,720px"></dc-import></sc-if>

<sc-if value="{{on.s5}}" hint-placeholder-val="{{false}}"><dc-import name="Y2029" hint-size="1280px,720px"></dc-import></sc-if>

<sc-if value="{{on.s7}}" hint-placeholder-val="{{false}}"><dc-import name="Y2031" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s8}}" hint-placeholder-val="{{false}}"><dc-import name="Y2032" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s9}}" hint-placeholder-val="{{false}}"><dc-import name="AppM" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s10}}" hint-placeholder-val="{{false}}"><dc-import name="AppN" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s11}}" hint-placeholder-val="{{false}}"><dc-import name="Y2033" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s12}}" hint-placeholder-val="{{false}}"><dc-import name="AppQ" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s13}}" hint-placeholder-val="{{false}}"><dc-import name="Y2034" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s14}}" hint-placeholder-val="{{false}}"><dc-import name="Y2035" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s15}}" hint-placeholder-val="{{false}}"><dc-import name="Y2036" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s16}}" hint-placeholder-val="{{false}}"><dc-import name="AppX" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s17}}" hint-placeholder-val="{{false}}"><dc-import name="Y2037" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s18}}" hint-placeholder-val="{{false}}"><dc-import name="Y2038" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s19}}" hint-placeholder-val="{{false}}"><dc-import name="Y2039" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s20}}" hint-placeholder-val="{{false}}"><dc-import name="Y2040" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s21}}" hint-placeholder-val="{{false}}"><dc-import name="Branch" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s22}}" hint-placeholder-val="{{false}}"><dc-import name="PlanB" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s23}}" hint-placeholder-val="{{false}}"><dc-import name="PlanC" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s24}}" hint-placeholder-val="{{false}}"><dc-import name="PlanD" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s25}}" hint-placeholder-val="{{false}}"><dc-import name="PlanS" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s26}}" hint-placeholder-val="{{false}}"><dc-import name="Compare" hint-size="1280px,720px"></dc-import></sc-if>
<sc-if value="{{on.s27}}" hint-placeholder-val="{{false}}"><dc-import name="Credits" hint-size="1280px,720px"></dc-import></sc-if>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.42) 100%)"></div>
<sc-if value="{{even}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; display: flex">
<div class="shut-l" style="width: 640px; height: 720px; background: #0B0A08; border-right: 3px solid #C9A54E; box-sizing: border-box"></div>
<div class="shut-r" style="width: 640px; height: 720px; background: #0B0A08; border-left: 3px solid #C9A54E; box-sizing: border-box"></div>
</div>
</sc-if>
<sc-if value="{{odd}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; display: flex">
<div class="shut-l" style="width: 640px; height: 720px; background: #0B0A08; border-right: 3px solid #C9A54E; box-sizing: border-box"></div>
<div class="shut-r" style="width: 640px; height: 720px; background: #0B0A08; border-left: 3px solid #C9A54E; box-sizing: border-box"></div>
</div>
</sc-if>
</div>
<div style="position: relative; width: 1280px; height: 80px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 20px; background: #0B0A08; border-top: 1px solid #3A3222">
<div aria-hidden="true" style="position: absolute; left: 0; top: -1px; height: 3px; width: {{progressPct}}; background: #C9A54E"></div>
<div style="display: flex; align-items: center; gap: 10px">
<button class="ctl" aria-label="Previous scene" onClick="{{prev}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v12"></path><path d="M14 3 L7 9 L14 15"></path></svg></button>
<button class="ctl" aria-label="{{playLabel}}" onClick="{{toggle}}" style="width: 52px; height: 52px; border-radius: 26px; background: #C9A54E; color: #0B0A08">
<sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><rect x="4" y="3" width="3.5" height="12"></rect><rect x="10.5" y="3" width="3.5" height="12"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><path d="M5 3 L15 9 L5 15 Z"></path></svg></sc-if>
</button>
<button class="ctl" aria-label="Next scene" onClick="{{next}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v12"></path><path d="M4 3 L11 9 L4 15"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 4px; flex: 1 1 auto; min-width: 0">
<sc-for list="{{chapters}}" as="c" hint-placeholder-count="16">
<button class="chip" aria-label="Jump to {{c.aria}}" onClick="{{c.go}}" style="{{c.st}}">{{c.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; width: 230px; text-align: right">
<div style="font-size: 11px; letter-spacing: 0.24em; color: #B3A88E; text-transform: uppercase">Reel {{reelNo}} / 28</div>
<div style="font-family: 'Limelight', serif; font-size: 15px; color: #D9B65E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px">{{sceneTitle}}</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"autoplay":{"editor":"boolean","default":true},"speed":{"editor":"range","min":0.5,"max":2,"step":0.25,"default":1,"unit":"×"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.SC = [
      ['Overture · AI 2040', 9], ['What is Plan A?', 15], ['The Timeline', 14],
      ['2027 · The Writing on the Wall', 14], ['2028 · AI on the Ballot', 14], ['2029 · Choose a Path', 19],
      ['2030 · Plan A is Established', 19], ['2031 · Safety Cases', 15], ['2032 · Controlled Explosive Growth', 19],
      ['Appendix M · Explosive Growth', 14], ['Appendix N · Five Centuries', 17], ["2033 · The Citizen's Dividend", 17],
      ['Appendix Q · AI for Epistemics', 14], ['2034 · Mutually Assured Compute Destruction', 17], ['2035 · Pause at Top Expert AI', 15],
      ['2036 · Life After Work', 19], ['Appendix X · AI & Robot Economy', 15], ['2037 · The Arrival of Truth', 15],
      ['2038 · Alignment Is a Science', 15], ['2039 · Beginning to Trust AIs', 17], ['2040 · Passing the Torch', 17],
      ['The Branch Point', 15], ['Plan B · Sabotage', 17], ['Plan C · The Slowdown', 17],
      ['Plan D · The Race', 17], ['Plan S · Shutdown', 17], ['Plan A vs. the Rest', 19], ['Fin', 12]
    ];
    this.CH = [['Intro','the overture',0],["'27",'2027',3],["'28",'2028',4],["'29",'2029',5],["'30",'2030',6],["'31",'2031',7],["'32",'2032',8],["'33",'2033',11],["'34",'2034',13],["'35",'2035',14],["'36",'2036',15],["'37",'2037',17],["'38",'2038',18],["'39",'2039',19],["'40",'2040',20],['Alt','the alternative plans',21]];
    this.state = { i: 0, el: 0, playing: this.props.autoplay ?? true };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.tick(), 200);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  tick() {
    if (!this.state.playing) return;
    const sp = this.props.speed ?? 1;
    const i = this.state.i;
    const el = this.state.el + 0.2 * sp;
    if (el >= this.SC[i][1]) {
      if (i < this.SC.length - 1) this.setState({ i: i + 1, el: 0 });
      else this.setState({ playing: false, el: this.SC[i][1] });
    } else {
      this.setState({ el });
    }
  }
  go(i) {
    const n = Math.max(0, Math.min(this.SC.length - 1, i));
    this.setState({ i: n, el: 0 });
  }
  renderVals() {
    const i = this.state.i;
    const on = {};
    for (let k = 0; k < this.SC.length; k++) on['s' + k] = k === i;
    let active = 0;
    this.CH.forEach((c, k) => { if (c[2] <= i) active = k; });
    const chapters = this.CH.map((c, k) => ({
      label: c[0],
      aria: c[1],
      go: () => this.go(c[2]),
      st: k === active ? 'border-color: #C9A54E; color: #0B0A08; background: #D9B65E' : ''
    }));
    const atEnd = i === this.SC.length - 1 && this.state.el >= this.SC[i][1];
    return {
      on,
      even: i % 2 === 0,
      odd: i % 2 === 1,
      playing: this.state.playing,
      paused: !this.state.playing,
      playLabel: this.state.playing ? 'Pause' : (atEnd ? 'Replay from the start' : 'Play'),
      toggle: () => {
        if (atEnd) this.setState({ i: 0, el: 0, playing: true });
        else this.setState({ playing: !this.state.playing });
      },
      prev: () => this.go(i - 1),
      next: () => this.go(i + 1),
      chapters,
      reelNo: String(i + 1).padStart(2, '0'),
      sceneTitle: this.SC[i][0],
      progressPct: (((i + Math.min(1, this.state.el / this.SC[i][1])) / this.SC.length) * 100).toFixed(2) + '%'
    };
  }
}
</script>
</body>
</html>
