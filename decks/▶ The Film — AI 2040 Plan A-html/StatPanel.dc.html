<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Ledger — yearly stats</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@300;400;600;700&family=Poiret+One&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 344px; height: 616px; box-sizing: border-box; padding: 18px 20px 16px; background: #15130F; border: 1.5px solid #C9A54E; outline: 1px solid #5E5134; outline-offset: 5px; font-family: 'Josefin Sans', sans-serif; color: #F1E7CF; display: flex; flex-direction: column; gap: 10px">
<div class="a-fade" style="display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" width="26" height="14" viewBox="0 0 26 14" fill="none" stroke="#C9A54E" stroke-width="1.2"><path d="M1 13 L13 1 L25 13"/><path d="M6 13 L13 6 L20 13"/><path d="M11 13 L13 11 L15 13"/></svg>
<div style="font-size: 12px; letter-spacing: 0.28em; color: #D9B65E; text-transform: uppercase; flex: 1 1 auto">The Ledger</div>
<div style="font-family: 'Limelight', serif; font-size: 22px; color: #D9B65E">{{yr}}</div>
</div>
<div aria-hidden="true" class="a-growx" style="height: 1px; background: #5E5134"></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div class="a-rise {{r.d}}" style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<div style="font-size: 11px; letter-spacing: 0.18em; color: #B3A88E; text-transform: uppercase">{{r.label}}</div>
<div style="font-size: 12px; color: #B3A88E">{{r.sub}}</div>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 10px">
<div style="font-family: 'Limelight', serif; font-size: 30px; line-height: 32px; color: #F1E7CF">{{r.val}}</div>
<div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 3px; height: 30px">
<sc-for list="{{r.bars}}" as="b" hint-placeholder-count="14">
<div class="a-growy {{r.d}}" style="width: 6px; {{b.st}}"></div>
</sc-for>
</div>
</div>
</div>
</sc-for>
<div aria-hidden="true" style="height: 1px; background: #5E5134"></div>
<div class="a-fade d8" style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.16em; color: #B3A88E; text-transform: uppercase"><span>Frontier compute, shared</span><span>~{{nProj}} projects</span></div>
<div class="a-wipe d9" style="display: flex; gap: 2px; height: 26px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="10">
<div style="{{t.st}}"></div>
</sc-for>
</div>
</div>
<div class="a-fade d10" style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; flex-wrap: wrap; gap: 3px; width: 304px">
<sc-for list="{{dots}}" as="o" hint-placeholder-count="40">
<div style="width: 7px; height: 7px; border-radius: 4px; box-sizing: border-box; {{o.st}}"></div>
</sc-for>
</div>
<div style="font-size: 11px; color: #B3A88E; letter-spacing: 0.04em">○ 100M human workers · <span style="color: #E0806C">●</span> 10M reliable AI agents</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"year":{"editor":"enum","options":["2027","2028","2029","2030","2031","2032","2033","2034","2035","2036","2037","2038","2039","2040"],"default":"2027"},"$preview":{"width":344,"height":616}}'>
class Component extends DCLogic {
  renderVals() {
    const Y = [2027,2028,2029,2030,2031,2032,2033,2034,2035,2036,2037,2038,2039,2040];
    const emp = [62,62,62,61,61,62,52,44,32,26,21,17,13,12];
    const inc = [47e3,49e3,50e3,52e3,52e3,104e3,193e3,429e3,1.1e6,2.1e6,3.9e6,6.8e6,10.3e6,13e6];
    const incL = ['$47K','$49K','$50K','$52K','$52K','$104K','$193K','$429K','$1.1M','$2.1M','$3.9M','$6.8M','$10.3M','$13M'];
    const ali = [1.2,1.4,1.7,3.5,10.4,20.7,31.1,46.7,60.7,78.8,102.5,133.3,173.2,225.2];
    const hum = [3.5,3.5,3.4,3.5,3.4,3.5,3.7,3.9,3.8,3.5,3.0,2.5,2.2,1.8];
    const agt = [28,23,29,47,46,65,120,170,180,170,170,180,180,190];
    const spd = ['114','131','150','189','238','300','378','476','600','814','1,105','1,500','1,937','2,500'];
    const nP = [10,11,11,14,19,21,24,28,32,40,42,34,40,46];
    const nL = [3,3,3,3,5,5,6,7,8,9,9,9,10,11];
    const y = parseInt(this.props.year ?? '2027', 10);
    let k = Y.indexOf(y); if (k < 0) k = 0;
    const lg = (v, a, b) => Math.max(0.06, Math.min(1, (Math.log10(v) - a) / (b - a)));
    const mk = (arr, f) => arr.map((v, j) => {
      const h = Math.round(4 + 26 * f(v));
      const col = j === k ? '#D9B65E' : (j < k ? '#6E6249' : 'transparent');
      const bd = j > k ? 'border: 1px solid #4A4130; box-sizing: border-box;' : '';
      return { st: 'height: ' + h + 'px; background: ' + col + '; ' + bd };
    });
    const rows = [
      { label: 'Employment rate', sub: '', val: emp[k] + '%', bars: mk(emp, v => v / 70), d: 'd1' },
      { label: 'Median income', sub: '', val: incL[k], bars: mk(inc, v => lg(v, 4.5, 7.2)), d: 'd2' },
      { label: 'Alignment researchers', sub: '', val: ali[k] + 'K', bars: mk(ali, v => lg(v, -0.2, 2.4)), d: 'd3' },
      { label: 'Human labor', sub: 'at ×1 speed', val: hum[k] + 'B', bars: mk(hum, v => v / 4), d: 'd4' },
      { label: 'Reliable agents', sub: 'at up to ×' + spd[k] + ' speed', val: agt[k] + 'M', bars: mk(agt, v => v / 200), d: 'd5' }
    ];
    const n = nP[k], L = nL[k];
    const a = 1.35 - 0.6 * (k / 13);
    const tiles = [];
    for (let j = 1; j <= n; j++) {
      const s = 1 / Math.pow(j, a);
      const lead = j <= L;
      tiles.push({ st: 'flex: ' + s.toFixed(4) + ' 1 0; min-width: 2px; box-sizing: border-box; border: 1px solid ' + (lead ? '#C25A48' : '#8C8068') + '; background: ' + (lead ? '#7E2620' : '#221E16') });
    }
    const dots = [];
    const hd = Math.round(hum[k] * 10), ad = Math.round(agt[k] / 10);
    for (let j = 0; j < hd; j++) dots.push({ st: 'border: 1.2px solid #CFC3A6' });
    for (let j = 0; j < ad; j++) dots.push({ st: 'background: #E0806C' });
    return { yr: String(y), rows, tiles, dots, nProj: n };
  }
}
</script>
</body>
</html>
